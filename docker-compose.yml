# Postgres 16 + pgvector. Port 5433 to avoid colliding with any local Postgres.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: swing-db
    environment:
      POSTGRES_USER: swing
      POSTGRES_PASSWORD: swing
      POSTGRES_DB: swing_agent
    ports:
      - "5433:5432"
    volumes:
      - swing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swing -d swing_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  swing-pgdata:
