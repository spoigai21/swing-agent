[project]
name = "swing-agent"
version = "0.2.0"
description = "Stock swing attribution — detects unusual moves and explains them, or abstains"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shayan Poigai", email = "spoigai21@gmail.com" }]
keywords = ["stocks", "attribution", "news", "llm", "finance", "equities", "sec-edgar"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "feedparser>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pgvector>=0.3",
    # Everything below used to sit behind optional extras, so the README's
    # `pip install swing-agent` produced a tool where `why` died on "No module
    # named 'numpy'" and `backfill` on 'pandas'. A user command must never need
    # an extra the user was not told about.
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "google-cloud-bigquery>=3.25",       # GDELT
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=2.0",       # Gemini, the only supported model provider
    "sentence-transformers>=3.0",        # local embeddings; pulls torch, the bulk of the download
    "datasketch>=1.6",                   # near-duplicate detection in normalize
]

# Research only — the Phase 5 classifiers. Nothing a user runs imports these.
[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "lightgbm>=4.3", "transformers>=4.44", "torch>=2.4"]
dev = ["pytest>=8.0", "matplotlib>=3.9", "ruff>=0.6"]
full = ["swing-agent[ml,dev]"]

[project.urls]
Homepage = "https://github.com/spoigai21/swing-agent"
Repository = "https://github.com/spoigai21/swing-agent"
Issues = "https://github.com/spoigai21/swing-agent/issues"

[project.scripts]
swing = "swing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ⚠️ config/ lives at the REPO root, outside the package, so it is absent from
# the wheel — which is why 0.1.0 was unusable by anyone but the author. These
# are the copies that ship, and `swing init` seeds ~/.swing from them.
# ⚠️ EVERY non-.py file the package reads at runtime has to be listed. `swing
# init` on a clean 0.1.0 install got past the database check and then died on
# a missing schema.sql, because only the code shipped. Test a real wheel in a
# clean environment, not the editable checkout — `uvx` silently prefers the
# checkout and hides exactly this.
[tool.setuptools.package-data]
swing = [
    "defaults/*.yaml",
    "defaults/prompts/*.md",
    "store/schema.sql",
    "store/migrations/script.py.mako",
    "eval/answer_key/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# `db` tests execute real SQL and need SWING_TEST_DATABASE_URL; they skip
# otherwise, so the default run stays fast and needs no Postgres.
markers = ["db: runs real SQL against a *_test Postgres"]

[tool.ruff]
line-length = 100
src = ["src"]
