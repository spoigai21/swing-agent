[project]
name = "swing-agent"
version = "0.1.0"
description = "Stock swing attribution — detects unusual moves and explains them, or abstains"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "feedparser>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

# Heavy/ML deps are opt-in so `swing coverage` stays fast and Step 0-1 do not
# pull a ~2GB torch download. Install with: pip install -e ".[full]"
[project.optional-dependencies]
data = ["numpy>=1.26,<3", "pandas>=2.2", "pyarrow>=16.0", "yfinance>=0.2.40", "finnhub-python>=2.4"]
ml = ["torch>=2.4", "transformers>=4.44", "sentence-transformers>=3.0", "lightgbm>=4.3",
      "scikit-learn>=1.5", "pgvector>=0.3", "datasketch>=1.6"]
llm = ["langgraph>=1.0", "langchain>=1.0", "langchain-core>=1.0",
       "langchain-google-genai>=2.0", "google-genai>=1.0"]
dev = ["pytest>=8.0", "matplotlib>=3.9", "ruff>=0.6"]
full = ["swing-agent[data,ml,llm,dev]"]

[project.scripts]
swing = "swing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
