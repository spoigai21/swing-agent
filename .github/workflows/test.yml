name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No database service. The suite runs green against an unreachable
      # DATABASE_URL — every test that would touch Postgres stubs the
      # connection — so CI stays under a minute. If that ever stops being
      # true, add a `pgvector/pgvector:pg16` service rather than skipping.
      - name: install
        run: uv sync --extra dev

      - name: lint
        run: uv run ruff check src tests

      - name: test
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          SEC_USER_AGENT: swing-agent CI (ci@example.com)
        run: uv run pytest -q
